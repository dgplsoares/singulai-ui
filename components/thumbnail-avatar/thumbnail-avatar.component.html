<div
  class="ds-thumbnail-avatar"
  [attr.data-size]="size()"
  [attr.aria-label]="ariaLabel() ?? name()"
  role="img"
>
  @if (hasImage()) {
    <img
      class="ds-thumbnail-avatar__img"
      [src]="src()!"
      [alt]="name()"
    />
  } @else {
    <span class="ds-thumbnail-avatar__initials" aria-hidden="true">{{
      initials()
    }}</span>
  }
</div>
